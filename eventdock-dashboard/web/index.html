<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EventDock - Developer platform for API error monitoring, stack trace inspection, and request replay.">
  <meta name="theme-color" content="#000000">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EventDock">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EventDock - Developer Platform</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #000000;
      color: #F5F5F5;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Firebase SDKs for Web Authentication -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBulU64fSaScUBzVnjv6kk9EwapZOpik7U",
      authDomain: "eventdock-5cc21.firebaseapp.com",
      projectId: "eventdock-5cc21",
      storageBucket: "eventdock-5cc21.firebasestorage.app",
      messagingSenderId: "775460024919",
      appId: "1:775460024919:web:c2772a2fd9b6905283a912",
      measurementId: "G-G0EVX02YGK"
    };
    firebase.initializeApp(firebaseConfig);

    window.eventdockGoogleSignIn = async function() {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('email');
        provider.addScope('profile');
        const result = await firebase.auth().signInWithPopup(provider);
        const user = result.user;
        const token = await user.getIdToken();
        return JSON.stringify({
          token: token,
          email: user.email,
          uid: user.uid,
          displayName: user.displayName || user.email
        });
      } catch (err) {
        console.error('EventDock Firebase Google Sign-In Error:', err);
        return null;
      }
    };

    window.eventdockSignOut = async function() {
      try {
        await firebase.auth().signOut();
      } catch (err) {
        console.error('EventDock Firebase Sign-Out Error:', err);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
