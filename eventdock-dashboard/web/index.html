<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EventDock - Developer platform for API error monitoring, stack trace inspection, and request replay.">
  <meta name="theme-color" content="#000000">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EventDock">
  <link rel="apple-touch-icon" href="EventDock-LOGO-BLACK.png">

  <!-- Favicon with automatic Light/Dark mode switching -->
  <link rel="icon" type="image/png" href="EventDock-LOGO-BLACK.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="EventDock-LOGO-WHITE.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>EventDock - Developer Platform</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }
    html, body {
      background-color: #090A0D;
      color: #F6F7FA;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Firebase SDKs for Web Authentication -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBulU64fSaScUBzVnjv6kk9EwapZOpik7U",
      authDomain: "eventdock-5cc21.firebaseapp.com",
      projectId: "eventdock-5cc21",
      storageBucket: "eventdock-5cc21.firebasestorage.app",
      messagingSenderId: "775460024919",
      appId: "1:775460024919:web:c2772a2fd9b6905283a912",
      measurementId: "G-G0EVX02YGK"
    };
    firebase.initializeApp(firebaseConfig);

    // Initial auth state tracking for instant restore on refresh
    let _initialAuthUser = null;
    let _initialAuthResolved = false;
    const _initialAuthPromise = new Promise((resolve) => {
      firebase.auth().onAuthStateChanged((user) => {
        _initialAuthUser = user;
        _initialAuthResolved = true;
        resolve(user);
      });
    });

    window.eventdockGetRestoredUser = async function() {
      try {
        let user = firebase.auth().currentUser || _initialAuthUser;
        if (!user && !_initialAuthResolved) {
          user = await Promise.race([
            _initialAuthPromise,
            new Promise((r) => setTimeout(() => r(null), 2500))
          ]);
        }

        if (user) {
          const token = await user.getIdToken();
          let savedMeta = {};
          try {
            const raw = localStorage.getItem('eventdock_session') || sessionStorage.getItem('eventdock_session');
            if (raw) savedMeta = JSON.parse(raw);
          } catch (_) {}

          return JSON.stringify({
            token: token,
            email: user.email,
            uid: user.uid,
            displayName: user.displayName || savedMeta.displayName || user.email,
            emailVerified: user.emailVerified,
            role: savedMeta.role || 'individual',
            orgName: savedMeta.orgName,
            orgId: savedMeta.orgId,
            rememberMe: savedMeta.rememberMe !== false
          });
        }

        // Fallback: check stored session for demo or token sessions
        const rawStored = localStorage.getItem('eventdock_session') || sessionStorage.getItem('eventdock_session');
        if (rawStored) {
          try {
            const session = JSON.parse(rawStored);
            if (session && session.token) {
              if (session.expiry && Date.now() > session.expiry) {
                localStorage.removeItem('eventdock_session');
                sessionStorage.removeItem('eventdock_session');
                return null;
              }
              return rawStored;
            }
          } catch (_) {}
        }
        return null;
      } catch (err) {
        console.error('EventDock restore session error:', err);
        return null;
      }
    };

    window.eventdockSaveSession = function(sessionJson, rememberMe) {
      try {
        if (rememberMe) {
          localStorage.setItem('eventdock_session', sessionJson);
          sessionStorage.removeItem('eventdock_session');
        } else {
          sessionStorage.setItem('eventdock_session', sessionJson);
          localStorage.removeItem('eventdock_session');
        }
      } catch (err) {
        console.error('EventDock save session error:', err);
      }
    };

    window.eventdockClearSession = function() {
      try {
        localStorage.removeItem('eventdock_session');
        sessionStorage.removeItem('eventdock_session');
      } catch (_) {}
    };

    window.eventdockSignInWithEmail = async function(email, password, rememberMe) {
      try {
        const persistence = rememberMe
          ? firebase.auth.Auth.Persistence.LOCAL
          : firebase.auth.Auth.Persistence.SESSION;
        await firebase.auth().setPersistence(persistence);
        const cred = await firebase.auth().signInWithEmailAndPassword(email, password);
        const user = cred.user;
        const token = await user.getIdToken();
        return JSON.stringify({
          token: token,
          email: user.email,
          uid: user.uid,
          displayName: user.displayName || user.email,
          emailVerified: user.emailVerified
        });
      } catch (err) {
        return JSON.stringify({ error: err.code || err.message });
      }
    };

    window.eventdockSignUpWithEmail = async function(email, password, rememberMe) {
      try {
        const persistence = rememberMe
          ? firebase.auth.Auth.Persistence.LOCAL
          : firebase.auth.Auth.Persistence.SESSION;
        await firebase.auth().setPersistence(persistence);
        const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
        const user = cred.user;
        const token = await user.getIdToken();
        return JSON.stringify({
          token: token,
          email: user.email,
          uid: user.uid,
          displayName: user.displayName || user.email,
          emailVerified: user.emailVerified
        });
      } catch (err) {
        return JSON.stringify({ error: err.code || err.message });
      }
    };

    window.eventdockGoogleSignIn = async function(rememberMe) {
      try {
        const persistence = (rememberMe !== false)
          ? firebase.auth.Auth.Persistence.LOCAL
          : firebase.auth.Auth.Persistence.SESSION;
        await firebase.auth().setPersistence(persistence);
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('email');
        provider.addScope('profile');
        const result = await firebase.auth().signInWithPopup(provider);
        const user = result.user;
        const token = await user.getIdToken();
        return JSON.stringify({
          token: token,
          email: user.email,
          uid: user.uid,
          displayName: user.displayName || user.email,
          emailVerified: user.emailVerified
        });
      } catch (err) {
        console.error('EventDock Firebase Google Sign-In Error:', err);
        return null;
      }
    };

    window.eventdockSignOut = async function() {
      try {
        await firebase.auth().signOut();
      } catch (err) {
        console.error('EventDock Firebase Sign-Out Error:', err);
      }
      try {
        localStorage.removeItem('eventdock_session');
        sessionStorage.removeItem('eventdock_session');
      } catch (_) {}
    };

    window.eventdockDownloadFile = function(filename, content, mimeType) {
      try {
        const blob = new Blob([content], { type: mimeType || 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(function() {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 150);
      } catch (err) {
        console.error('EventDock Download Error:', err);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
