server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: LinkPeer
  datasource:
    url: jdbc:h2:mem:linkpeer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eventdock:
  enabled: ${EVENTDOCK_ENABLED:true}
  endpoint: ${EVENTDOCK_ENDPOINT:http://localhost:8080}
  api-key: ${EVENTDOCK_API_KEY:ed_live_sample_demo_key}
  service-name: LinkPeer
  environment: local-dev
  min-status-code: 400
  capture-client-errors: true
  capture-server-errors: true
  capture:
    body-enabled: true
    max-body-length: 4096
    max-stack-trace-frames: 30
  redaction:
    headers:
      - authorization
      - cookie
      - x-api-key
    body-fields:
      - password
      - secret
      - token
  queue:
    capacity: 200
    batch-size: 10
    flush-interval-ms: 500
  network:
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
